{% set base_path = request.headers.get('X-Ingress-Path', '') %}
<!DOCTYPE html>
<html lang="{{ locale(request) }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{{ base_path }}/static/mobile-detect.js"></script>
    <script src="{{ base_path }}/static/confirm.js"></script>
    <script src="{{ base_path }}/static/local-time.js"></script>
    <script src="{{ base_path }}/static/swipe-nav.js"></script>
    <title>{% block title %}Matched Runs{% endblock %}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="{{ base_path }}/static/style.css">
    <script src="{{ base_path }}/static/vendor/leaflet/leaflet.js"></script>
</head>
<body>
    <header class="row" style="justify-content: space-between;">
        <!-- Product name - deliberately not run through t(): a brand
             name doesn't get translated, same call as HA add-on/integration
             names never being localized either. -->
        <a href="{{ base_path }}/" class="brand">Matched Runs</a>
        <nav class="row">
            <a href="{{ base_path }}/routes" style="color: var(--text); text-decoration: none;">{{ t(request, "nav.routes") }}</a>
            <a href="{{ base_path }}/log" style="color: var(--text); text-decoration: none;">{{ t(request, "nav.log") }}</a>
            <a href="{{ base_path }}/manage" style="color: var(--text); text-decoration: none;">{{ t(request, "nav.manage") }}</a>
            {% if supported_locales|length > 1 %}
            <!-- Lets a user override the app's language directly, on top of
                 (and taking priority over) both the browser's own
                 Accept-Language and an admin-pinned LOCALE setting - see
                 resolve_locale()'s precedence in app/i18n.py. Each language
                 is shown in itself, not translated into the currently
                 active one - the point of a language picker is finding
                 your own language, not reading about it in another one. -->
            <form method="post" action="{{ base_path }}/set-locale">
                <select name="locale" onchange="this.form.submit()" aria-label="{{ t(request, 'common.language') }}">
                    <option value="" {% if not cookie_locale(request) %}selected{% endif %}>{{ t(request, "common.locale_auto") }}</option>
                    {% for code in supported_locales %}
                    <option value="{{ code }}" {% if cookie_locale(request) == code %}selected{% endif %}>{{ locale_name(code) }}</option>
                    {% endfor %}
                </select>
            </form>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
